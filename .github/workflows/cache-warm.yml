name: Warm Build Caches

# GitHub scopes action caches to the ref that created them, and every release tag
# is a ref of its own. A tag run can therefore only restore caches created on that
# same tag (which never happens twice) or on the default branch — so without this
# workflow every release starts cold: the cargo registry and the release target
# directory miss, and the Rust release build runs from scratch on both
# architectures.
#
# Keeping the default branch's scope warm is what makes a tag run hit. The cargo
# cache key must stay identical to the one `ci-docker.yml` uses for its release
# matrix, otherwise warming this scope saves nothing.
on:
  push:
    branches: [master]
    paths:
      - 'backend/app/Cargo.lock'
      - 'backend/app/Cargo.toml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/cache-warm.yml'
      - '.github/workflows/ci-docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      # Save the same key the release matrix restores on a tag run.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/app/target
          key: yin-panel-release-${{ matrix.arch }}-${{ hashFiles('backend/app/Cargo.lock') }}
      - name: Build the binary
        run: |
          mkdir -p build-output
          cargo build --release --manifest-path backend/app/Cargo.toml
          cp -a backend/app/target/release/yin-panel build-output/yin-panel

  node:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Warm the npm cache
        working-directory: frontend
        run: npm ci
