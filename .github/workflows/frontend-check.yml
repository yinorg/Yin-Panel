name: Frontend Checks

on:
  push:
    branches: [master, alkaid-dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-check.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-check.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check:i18n
          npm run audit:theme-tokens
          npm run type-check
          npm run lint
          npm run build-only

  pnpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install and verify frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run check:i18n
          pnpm run audit:theme-tokens
          pnpm run type-check
          pnpm run lint
          pnpm run build-only
