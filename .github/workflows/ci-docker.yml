name: Build Docker Image

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (dev, stg, or X.Y.Z-dev.N / X.Y.Z-stg.N)
        required: true
        default: dev

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(dev|stg)(\.[0-9]+)?$ ]] || {
            echo "Only 0.8.0, 0.8.0-dev[.N] or 0.8.0-stg[.N] tags are published."
            exit 1
          }
      - name: Validate dispatch tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          [[ "${INPUT_TAG}" == "dev" || "${INPUT_TAG}" == "stg" || "${INPUT_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(dev|stg)(\.[0-9]+)?$ ]] || {
            echo "A manual dispatch may only publish 'dev', 'stg', or an X.Y.Z-(dev|stg)[.N] tag; it must never publish a release version."
            exit 1
          }
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build-only
      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: backend/web
          retention-days: 1

  backend:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build backend
        working-directory: backend
        env:
          CGO_ENABLED: '1'
          CC: musl-gcc
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p ../build-output
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -buildvcs=true -tags timetzdata -o ../build-output/yin-panel \
            -ldflags="-s -w -X github.com/yinorg/Yin-Panel/backend/internal/global.RUNCODE=release -X github.com/yinorg/Yin-Panel/backend/internal/global.VERSION=${VERSION} -X github.com/yinorg/Yin-Panel/backend/internal/global.COMMIT=${COMMIT} -X github.com/yinorg/Yin-Panel/backend/internal/global.BUILD_TIME=${BUILD_TIME}" \
            main.go

      - name: Upload backend build
        uses: actions/upload-artifact@v7
        with:
          name: backend-build-${{ matrix.arch }}
          path: build-output/yin-panel
          retention-days: 1

  image:
    needs: [frontend, backend]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: backend/web
      - name: Download backend build
        uses: actions/download-artifact@v8
        with:
          name: backend-build-${{ matrix.arch }}
          path: build-output
      # Artifacts do not preserve file modes, so the binary lands here 0644. Fix it
      # at the source too: the image must stay buildable even if the Dockerfile's
      # COPY stops forcing the mode.
      - name: Restore the executable bit
        run: chmod +x build-output/yin-panel
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push architecture image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./distribution/docker-image/Dockerfile_monolith
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/yinorg/yin-panel-ce,push-by-digest=true,name-canonical=false,push=true
          build-args: |
            VERSION=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            COMMIT=${{ github.sha }}
      - name: Save image digest
        run: echo "${{ steps.build-image.outputs.digest }}" > digest
      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: digest
          retention-days: 1

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      # No `setup-buildx-action` here: `imagetools create` only talks to the
      # registry, so the runner's default builder is enough. The action spun up a
      # `docker-container` builder (pulling moby/buildkit) for ~11s to do nothing.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download amd64 image digest
        uses: actions/download-artifact@v8
        with:
          name: image-digest-amd64
          path: digests/amd64
      - name: Download arm64 image digest
        uses: actions/download-artifact@v8
        with:
          name: image-digest-arm64
          path: digests/arm64
      - name: Publish multi-architecture image
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          AMD64_DIGEST=$(cat digests/amd64/digest)
          ARM64_DIGEST=$(cat digests/arm64/digest)
          docker buildx imagetools create \
            -t ghcr.io/yinorg/yin-panel-ce:${VERSION} \
            ghcr.io/yinorg/yin-panel-ce@${AMD64_DIGEST} \
            ghcr.io/yinorg/yin-panel-ce@${ARM64_DIGEST}
      # Kept separate so a dev build can never move the release alias: only a
      # release tag push is allowed to repoint `latest` (a hyphen means dev).
      - name: Publish the latest alias
        if: github.event_name == 'push' && !contains(github.ref_name, '-')
        run: |
          AMD64_DIGEST=$(cat digests/amd64/digest)
          ARM64_DIGEST=$(cat digests/arm64/digest)
          docker buildx imagetools create \
            -t ghcr.io/yinorg/yin-panel-ce:latest \
            ghcr.io/yinorg/yin-panel-ce@${AMD64_DIGEST} \
            ghcr.io/yinorg/yin-panel-ce@${ARM64_DIGEST}
      # Tell the deploy side in-band. The GHCR `package` event is not used any
      # more: it arrives minutes late and out of order, and one build produces
      # several of them. This runs only after every publish step above succeeded.
      #
      # The body mirrors the package event's field paths on purpose, so the
      # hook's trigger-rule and pass-arguments-to-command match unchanged.
      - name: Tell the deploy side
        env:
          SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          body=$(printf '{"action":"published","package":{"package_type":"CONTAINER","package_version":{"container_metadata":{"tag":{"name":"%s"}}}}}' "$TAG")
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')"
          curl -fsS -X POST "https://nginx-ui.yiniot.com/hooks/yin-panel-prd-deploy" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: $sig" \
            -d "$body"
          echo "notified: $TAG"
