name: Build Docker Image

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (for example 0.3.1)
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only standard version tags such as 0.3.1 are published."
            exit 1
          }
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./distribution/docker-image/Dockerfile_monolith
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/yinorg/yin-panel:${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            ghcr.io/yinorg/yin-panel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
