[package]
name = "yin-db-tool"
version = "0.1.0"
edition = "2024"
publish = false
description = "Schema upgrade and database copy for Yin-Panel, in Rust"

[[bin]]
name = "yin-db"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "postgres", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[workspace]
