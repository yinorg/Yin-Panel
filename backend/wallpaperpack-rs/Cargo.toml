[package]
name = "wallpaperpack-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `internal/biz/theme/wallpaperpack/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
# No `preserve_order`: the wired route serialises `gin.H` maps, which Go emits in
# sorted key order, and serde_json's default map does the same.
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
