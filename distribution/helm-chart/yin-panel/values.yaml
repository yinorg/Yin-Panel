nameOverride: yin-panel
fullnameOverride: yin-panel

replicaCount: 1

image:
  repository: ghcr.io/yinorg/yin-panel-ce
  pullPolicy: IfNotPresent
  tag: ""

resources:
  limits:
    cpu: 1000m
    memory: 100Mi
  requests:
    cpu: 100m
    memory: 20Mi

service:
  type: ClusterIP
  port: 3002

nodeSelector: {}

tolerations: {}

affinity: {}

appConfig:
  # Base configuration
  base:
    # Web run port. Default:3002
    http_port: 3002
    # Root URL
    root_url: http://127.0.0.1:3002
    # Database driver [mysql/sqlite(Default)]
    database_drive: sqlite
    # Enable static file server. Default:true
    enable_static_server: true
    # Enable system monitor feature. Default:true
    enable_monitor: false
    # Enable proxy feature to solve some network issues. Default:false
    enable_node_proxy: false
    # Used as prefix to generate file url. For example, it will lookup to "/uploads/xxxx.png"
    url_prefix: /uploads/

  # SQLite configuration (valid when database_drive=sqlite)
  sqlite:
    file_path: ./database/database.db

  # MySQL configuration (valid when database_drive=mysql)
  mysql:
    host: 127.0.0.1
    port: 3306
    username: root
    password: root
    db_name: sunpanel
    wait_timeout: 100

  # Core CE uses local storage. S3 is available in the EE image.
  rclone:
    # dir path of local or bucket of remote storage. this item config not belong to rclone
    type: local
    bucket: uploads
    rclone.conf: |-
      # type = s3
      # provider = AWS
      # access_key_id = AK
      # secret_access_key = SK
      # endpoint = https://s3.ap-east-1.amazonaws.com
      # region = ap-east-1

      # type = s3
      # provider = Minio
      # access_key_id = AK
      # secret_access_key = SK
      # endpoint=http://minio.infra:9000

      # type=s3
      # provider = Alibaba
      # access_key_id = AK
      # secret_access_key = SK
      # endpoint = oss-cn-hangzhou.aliyuncs.com

  # JWT configuration
  jwt:
    # JWT secret key
    secret: your_secret_key
    # JWT token expiration time in hours, default: 2160 (90 days). Values <= 0 use the default.
    expire: 2160

  # OAuth 2.0 / OpenID Connect providers
  oauth:
    # Enable OAuth login, default: false
    enable: false
    # Add one or more providers and set enable: true to enable OAuth login.
    providers: []
      # GitHub (OAuth 2.0)
      # Register <base.root_url>/api/oauth/github/callback as the callback URL.
      # - name: github
      #   client_id: your_github_client_id
      #   client_secret: your_github_client_secret
      #   auth_url: https://github.com/login/oauth/authorize
      #   token_url: https://github.com/login/oauth/access_token
      #   user_info_url: https://api.github.com/user
      #   user_info_email_url: https://api.github.com/user/emails
      #   scopes: read:user user:email
      #   field_mapping_identifier: id
      #   field_mapping_display_name: name
      #   field_mapping_email: email

      # GitLab (standard OIDC)
      # Register <base.root_url>/api/oauth/gitlab/callback as the callback URL.
      # - name: gitlab
      #   client_id: your_gitlab_client_id
      #   client_secret: your_gitlab_client_secret
      #   issuer_url: https://gitlab.com
      #   scopes: openid profile email
      #   field_mapping_identifier: sub
      #   field_mapping_display_name: name
      #   field_mapping_email: email

      # Google (OAuth 2.0)
      # Register <base.root_url>/api/oauth/google/callback as the callback URL.
      # - name: google
      #   client_id: your_google_client_id
      #   client_secret: your_google_client_secret
      #   auth_url: https://accounts.google.com/o/oauth2/v2/auth
      #   token_url: https://oauth2.googleapis.com/token
      #   user_info_url: https://www.googleapis.com/oauth2/v3/userinfo
      #   scopes: profile email
      #   field_mapping_identifier: sub
      #   field_mapping_display_name: name
      #   field_mapping_email: email
