<!doctype html>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yin-Panel Clear Local Data</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; background: #f5f6f8; color: #20242b; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
    main { width: min(560px, calc(100% - 40px)); }
    h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; }
    p { margin: 0 0 12px; line-height: 1.6; }
    ul { margin: 0 0 20px; padding-left: 20px; line-height: 1.8; }
    .muted { color: #5b6673; }
    .failed { color: #a12627; }
    .ok { color: #28784a; }
    a.button { display: inline-flex; min-height: 44px; align-items: center; padding: 0 18px; border: 0; border-radius: 6px; background: #2675d8; color: #fff; font: inherit; text-decoration: none; }
    @media (prefers-color-scheme: dark) { :root { background: #15191f; color: #edf1f5; } .muted { color: #9aa6b4; } }
  </style>
</head>
<body>
  <main data-testid="static-clear">
    <h1 data-i18n="title">Clear local data</h1>
    <p class="muted" data-i18n="intro">
      This page runs on its own, without the application bundle, so it still works when the
      panel will not load. It clears this browser only; nothing on the server is touched.
    </p>
    <ul id="results"></ul>
    <p id="status" class="muted" data-i18n="working">Clearing…</p>
    <p><a class="button" href="/" data-i18n="open">Open Yin-Panel</a></p>
  </main>

    // The translations are inlined rather than loaded, because loading anything is

      // Mirrors resolveBrowserLocale() in frontend/src/locales/index.ts.
      function pickLocale() {
        var raw = (navigator.language || navigator.userLanguage || '').toLowerCase()
        if (raw.indexOf('zh-tw') === 0 || raw.indexOf('zh-hk') === 0 || raw.indexOf('zh-mo') === 0) return 'zh-TW'
        if (raw.indexOf('zh') === 0) return 'zh-CN'
        if (raw.indexOf('ja') === 0) return 'ja-JP'
        if (raw.indexOf('ko') === 0) return 'ko-KR'
        if (raw.indexOf('de') === 0) return 'de-DE'
        if (raw.indexOf('fr') === 0) return 'fr-FR'
        if (raw.indexOf('es') === 0) return 'es-ES'
        if (raw.indexOf('pt') === 0) return 'pt-BR'
        if (raw.indexOf('ru') === 0) return 'ru-RU'
        return 'en-US'
      }

      var locale = pickLocale()
      var messages = MESSAGES[locale] || MESSAGES['en-US']

      function t(key, replacements) {
        var text = messages[key] || MESSAGES['en-US'][key] || key
        if (replacements) {
          Object.keys(replacements).forEach(function (name) {
            text = text.replace('{' + name + '}', String(replacements[name]))
          })
        }
        return text
      }

      document.documentElement.lang = locale

      // Static copy first, so the page reads correctly before any work happens.
      var nodes = document.querySelectorAll('[data-i18n]')
      for (var index = 0; index < nodes.length; index += 1) {
        var node = nodes[index]
        var key = node.getAttribute('data-i18n')
        if (key && messages[key]) node.textContent = messages[key]
      }
      var titleNode = document.querySelector('title')
      if (titleNode) titleNode.textContent = 'Yin-Panel — ' + t('title')

      var results = document.getElementById('results')
      var status = document.getElementById('status')
      var failures = 0

      // 这个页面唯一的用处，是在面板打不开的时候还能清掉浏览器的数据。而它自己
      // 可能是在一个沙箱 iframe 里被打开的——那种文档没有 `allow-same-origin`，
      // 浏览器直接禁掉 localStorage / sessionStorage / caches / serviceWorker 四项，
      // 于是每一步都失败，只留下四行看不懂的英文报错。
      //
      // 先自检环境：不可清理就只说一句话 + 给出可复制的地址，让用户自己去标签页打开。
      // 比在这里报告四条失败有用得多。
      function sandboxReason() {
        if (window.top === window.self) return null
        // 顶层文档才允许动这些存储。frameLocator / 沙箱判定都比直接读属性可靠：
        // 读 localStorage 本身在沙箱里是抛异常的。
        try {
          var probe = window.localStorage
          probe.getItem('__yin_probe__')
          probe.removeItem('__yin_probe__')
          // 能读说明有真实源，那这个 frame 只是普通内嵌，不是拦路的那一种。
          return null
        }
        catch (error) {
          return 'framed'
        }
      }

      function showSandboxNotice() {
        var item = document.createElement('li')
        item.className = 'failed'
        var headline = document.createElement('strong')
        headline.textContent = t('sandboxBlocked')
        var how = document.createElement('div')
        how.className = 'muted'
        how.textContent = t('sandboxHint')

        var link = document.createElement('a')
        link.href = location.href
        link.className = 'url'
        link.textContent = location.href

        item.appendChild(headline)
        results.appendChild(item)
        results.appendChild(how)
        results.appendChild(link)

        status.textContent = t('sandboxStatus')
        status.className = 'failed'
      }

      function report(text, ok) {
        var item = document.createElement('li')
        item.textContent = (ok ? '✓ ' : '✗ ') + text
        item.className = ok ? 'ok' : 'failed'
        results.appendChild(item)
        if (!ok) failures += 1
      }

      async function step(okKey, failKey, action) {
        try {
          var skipped = await action()
          report(t(skipped || okKey), true)
        }
        catch (error) {
          var detail = error && error.message ? error.message : String(error)
          var message = t(failKey, { count: detail })
          // A failure message that still carries the raw count is clearer than one
          // that hides it, so the detail is appended when the template lacks it.
          if (message.indexOf('{count}') === -1 && message.indexOf(detail) === -1) message += ' — ' + detail
          report(message, false)
        }
      }

      async function run() {
        await step('local', 'localFail', function () {
          localStorage.clear()
          if (localStorage.length !== 0) throw new Error(String(localStorage.length))
        })

        await step('session', 'sessionFail', function () {
          sessionStorage.clear()
          if (sessionStorage.length !== 0) throw new Error(String(sessionStorage.length))
        })

        await step('workers', 'workersFail', async function () {
          if (!('serviceWorker' in navigator)) return 'workersSkip'
          var registrations = await navigator.serviceWorker.getRegistrations()
          await Promise.all(registrations.map(function (registration) { return registration.unregister() }))
          var remaining = await navigator.serviceWorker.getRegistrations()
          if (remaining.length !== 0) throw new Error(String(remaining.length))
        })

        await step('caches', 'cachesFail', async function () {
          if (typeof caches === 'undefined') return 'cachesSkip'
          var names = await caches.keys()
          await Promise.all(names.map(function (name) { return caches.delete(name) }))
          var remaining = await caches.keys()
          if (remaining.length !== 0) throw new Error(String(remaining.length))
        })

        // A worker that is already controlling this client keeps serving from its
        // own memory until the client goes away, so the reload the page offers is
        // what actually puts the cleared state into effect.
        status.textContent = failures === 0 ? t('done') : t('problems', { count: failures })
        status.className = failures === 0 ? 'ok' : 'failed'
      }

      if (sandboxReason()) showSandboxNotice()
      else run()
    })()
  </script>
</body>
</html>
