<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yin-Panel Theme Recovery</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; background: #f5f6f8; color: #20242b; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
    main { width: min(560px, calc(100% - 40px)); }
    button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 6px; background: #2675d8; color: #fff; cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { background: #15191f; color: #edf1f5; } }
  </style>
</head>
<body>
  <main data-testid="static-theme-recovery">
    <h1>Theme recovery</h1>
    <p id="status">Community theme scripts are disabled for this session.</p>
    <button id="safe-mode" type="button">Open Yin-Panel in safe mode</button>
  </main>
  <script>
    const key = 'yin-theme-safe-mode'
    document.querySelector('#safe-mode').addEventListener('click', () => {
      sessionStorage.setItem(key, '1')
      window.location.assign('/')
    })
  </script>
</body>
</html>
