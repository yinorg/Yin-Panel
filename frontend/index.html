<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8">

	<!--
		The exfiltration guard for the "theme = app" model. `connect-src`/`img-src`
		are locked to this origin so a theme cannot beacon data to an arbitrary
		host; `api.iconify.design` is the only legitimate cross-origin API (item
		icon resolution). `script-src` keeps 'unsafe-inline' and `blob:` because the
		untrusted sandbox preview runs an inline bootstrap in a srcdoc frame that
		inherits this policy and the trusted theme module is imported from a blob
		URL; under model 3 the theme's own code is trusted, so egress is the
		boundary, not script execution. `frame-src` allows the in-panel window to
		open external bookmarks. A meta policy is used instead of a response header
		so the PWA service worker cannot cache a stale policy with the shell.
	-->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.iconify.design; frame-src 'self' https: http: about: data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'">

	<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
	<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

	<meta content="yes" name="apple-mobile-web-app-capable"/>
	<meta content="yes" name="mobile-web-app-capable"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<title>Yin-Panel</title>
</head>

<body class="dark:bg-black">
	<div id="app">
		<style>
			.loading-wrap {
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				color: #fff;
				background: #363636;
			}

			.initial-brand {
				font: 700 clamp(1.35rem, 5vw, 3.75rem)/1.2 system-ui, sans-serif;
				text-shadow: 2px 2px 50px #000;
			}

			@media (prefers-color-scheme: dark) {
				body {
					background: #121212;
				}
			}
		</style>
		<div class="loading-wrap">
			<div class="initial-brand" data-lcp="brand">Yin-Panel</div>
		</div>
	</div>
	<script type="module" src="/src/main.ts"></script>
</body>

</html>
