[package]
name = "run-original"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `run-original`, generated by rust-anything: Rust owns the server, the original answers what is not ported yet"

[[bin]]
name = "run-original"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
flate2 = "1"
rand = "0.8"
ed25519-dalek = "2"
jsonwebtoken = "9"
libc = "0.2"
md-5 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
ini = "1"
urlencoding = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "runtime-tokio-rustls", "any", "sqlite", "mysql", "postgres", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
wallpaperpack-rs = { path = "../wallpaperpack-rs" }
yin-db-tool = { path = "../db-tool" }

[workspace]
