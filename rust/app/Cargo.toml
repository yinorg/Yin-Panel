[package]
name = "run-original"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `run-original`, generated by rust-anything: Rust owns the server, the original answers what is not ported yet"

[[bin]]
name = "run-original"
path = "src/main.rs"

[dependencies]
axum = "0.8"
jsonwebtoken = "9"
md-5 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
reqwest = { version = "0.12", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
wallpaperpack-rs = { path = "../wallpaperpack-rs" }

[workspace]
