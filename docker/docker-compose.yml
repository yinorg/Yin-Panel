services:
  yin-panel:
    image: ${YIN_PANEL_IMAGE:-ghcr.io/yinorg/yin-panel-ce:latest}
    pull_policy: missing
    container_name: yin-panel
    restart: unless-stopped
    # Keep the limit generous enough for the SQLite page cache and the
    # wallpaper library the process maps at start.
    deploy:
      resources:
        limits:
          memory: 256m
    volumes:
      - ./conf.yaml:/app/conf.yaml
      - ./uploads:/app/uploads
      - ./database:/app/database
    ports:
      - "${YIN_PANEL_PORT:-3002}:3002"
    healthcheck:
      # `wget` is not in the slim image; use the same bash /dev/tcp probe as
      # the image's own HEALTHCHECK.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3002 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
