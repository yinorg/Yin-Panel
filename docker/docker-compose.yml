services:
  yin-panel:
    image: ${YIN_PANEL_IMAGE:-ghcr.io/yinorg/yin-panel-ce:0.3.11}
    pull_policy: missing
    container_name: yin-panel
    restart: unless-stopped
    volumes:
      - ./conf.yaml:/app/conf.yaml
      - ./uploads:/app/uploads
      - ./database:/app/database
    ports:
      - "${YIN_PANEL_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3002/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
